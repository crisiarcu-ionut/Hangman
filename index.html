<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hangman</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="bg-dark text-white text-center">
        <header>
            <p class="text-start">lives left: <span id="no-lives">0</span></p>
            <h1 class="mb-5">Hangman</h1>
        </header>
        <h2 id="word">_ _ _ _ _ _</h2>
        <form class="m-5 ">
            <div class="input-group w-15 center-block">
                <input type="text" maxlength="1" placeholder="Letter" class="form-control bg-dark text-light">
                <button type="button" class="btn btn-secondary" onclick="onBtnClick()">Check</button>
            </div>
        </form>
        <h3 class="text-success visually-hidden">You Won!</h3>
        <script src="script.js"></script>
    </body>
</html>
